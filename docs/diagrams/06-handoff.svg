<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="925" viewBox="0 0 1280 925" role="img" aria-labelledby="title description">
<title id="title">06 / A command can become obsolete while it is being computed</title><desc id="description">Illustrative order, not elapsed-time scale. Columns show ownership; calls can execute in the caller’s context.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="925" rx="18" fill="#ffffff"/>
<g><rect x="40" y="810" width="1200" height="84" rx="12" fill="#edf3ff"/></g><g><path d="M 155,200 L 155,790" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 465,200 L 465,790" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 795,200 L 795,790" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 1125,200 L 1125,790" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 155,235 L 465,235" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 155,375 L 465,375" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 465,425 L 795,425" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 155,500 L 465,500" fill="none" stroke="#bc3548" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><path d="M 465,585 L 1125,585" fill="none" stroke="#bc3548" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><path d="M 795,620 L 955,620 L 955,700 L 905,700" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">06 / A command can become obsolete while it is being computed</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">Illustrative order, not elapsed-time scale. Columns show ownership; calls can execute in the caller’s context.</text><rect x="40" y="125" width="230" height="75" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="60" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">ESP32</text><rect x="350" y="125" width="230" height="75" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="370" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">CAN RX / main.c</text><rect x="680" y="125" width="230" height="75" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="700" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Foreground / main.c</text><rect x="1010" y="125" width="230" height="75" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="1030" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">FOC / output API</text><rect x="235.9" y="199" width="108.19999999999999" height="23" rx="5" fill="#ffffff"/><text x="290" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">ARM: FF × 8</text><rect x="355" y="265" width="220" height="90" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="375" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Accept ARM</text><text x="375" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Goals + generation N</text><rect x="207.2" y="337" width="165.6" height="23" rx="5" fill="#ffffff"/><text x="290" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Full servo command</text><rect x="547.2" y="388" width="165.6" height="23" rx="5" fill="#ffffff"/><text x="630" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Snapshot goals + N</text><rect x="685" y="450" width="220" height="100" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="705" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Compute Iq</text><text x="705" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Use local snapshot</text><text x="705" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Interrupts remain enabled</text><rect x="223.60000000000002" y="462" width="132.79999999999998" height="23" rx="5" fill="#ffffff"/><text x="290" y="479" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#bc3548" font-weight="600" text-anchor="middle">DISARM: 00 × 8</text><rect x="601.5" y="549" width="386.99999999999994" height="23" rx="5" fill="#ffffff"/><text x="795" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#bc3548" font-weight="600" text-anchor="middle">Servo_Disarm → API_FOC_Torque_Disable → coast</text><rect x="685" y="645" width="220" height="110" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="705" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Recheck fails</text><text x="705" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Arming is now false</text><text x="705" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Old demand discarded</text><rect x="1010" y="645" width="230" height="110" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="1030" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Outputs off</text><text x="1030" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">No stale Iq applied</text><rect x="887.7" y="589" width="124.6" height="23" rx="5" fill="#ffffff"/><text x="950" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Publish check</text><text x="60" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">Why the generation number also matters</text><text x="60" y="869" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">If DISARM is followed quickly by a new ARM, N changes. A calculation from the previous arm is still rejected.</text></g></svg>