<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="835" viewBox="0 0 1280 835" role="img" aria-labelledby="title description">
<title id="title">02 / From position to phase currents</title><desc id="description">The outer loop asks for torque current. The inner loop makes the motor currents follow it.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="835" rx="18" fill="#ffffff"/>
<g><rect x="40" y="620" width="1200" height="84" rx="12" fill="#edf3ff"/><rect x="40" y="710" width="1200" height="84" rx="12" fill="#fff7e8"/></g><g><path d="M 250,205 L 330,205" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 620,205 L 700,205" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 920,205 L 1000,205" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1120,280 L 1120,380" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1000,430 L 920,430" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 700,430 L 620,430" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 460,380 L 460,280" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 140,280 L 140,320 L 565,320 L 565,280" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 620,450 L 650,450 L 650,555 L 970,555 L 970,310 L 1040,310 L 1040,280" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1195,480 L 1195,515 L 1260,515 L 1260,315 L 1195,315 L 1195,280" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">02 / From position to phase currents</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">The outer loop asks for torque current. The inner loop makes the motor currents follow it.</text><rect x="40" y="145" width="210" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="60" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">CAN</text><text x="60" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Servo command</text><text x="60" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Position + Kp / Kd</text><text x="60" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Iq feed-forward</text><rect x="330" y="145" width="290" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="350" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">FOREGROUND / TARGET 4 KHZ</text><text x="350" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Position PD</text><text x="350" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Position-error difference</text><text x="350" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">No position integral</text><rect x="700" y="145" width="220" height="135" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="720" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Current clamp</text><text x="720" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Limit total Iq demand</text><text x="720" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Normal Id demand = 0</text><rect x="1000" y="145" width="240" height="135" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="1020" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">ADC IRQ / NOMINAL 40 KHZ</text><text x="1020" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">FOC current PI</text><text x="1020" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Clarke / Park + PI</text><text x="1020" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Inverse transform / PWM</text><rect x="1000" y="380" width="240" height="100" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="1020" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Power stage</text><text x="1020" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">PWM drives 3 phases</text><rect x="700" y="380" width="220" height="100" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="720" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Motor</text><text x="720" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Torque → rotation</text><rect x="330" y="380" width="290" height="100" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="350" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">AS5600 acquisition</text><text x="350" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Position + estimated velocity</text><rect x="642.8" y="166" width="34.4" height="23" rx="5" fill="#ffffff"/><text x="660" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Iq</text><rect x="922.3" y="166" width="75.39999999999999" height="23" rx="5" fill="#ffffff"/><text x="960" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Iq / Id</text><rect x="1070.0" y="320" width="100.0" height="23" rx="5" fill="#ffffff"/><text x="1120" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">PWM duties</text><rect x="381.3" y="320" width="157.39999999999998" height="23" rx="5" fill="#ffffff"/><text x="460" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#087f73" font-weight="600" text-anchor="middle">Position feedback</text><rect x="184.5" y="303" width="141.0" height="23" rx="5" fill="#ffffff"/><text x="255" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Iq feed-forward</text><rect x="714.4" y="538" width="231.2" height="23" rx="5" fill="#ffffff"/><text x="830" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#087f73" font-weight="600" text-anchor="middle">Predicted electrical angle</text><text x="1132" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#087f73" font-weight="400" text-anchor="middle">Phase currents via ADC</text><text x="60" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">Actual code detail</text><text x="60" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">Kd acts on a filtered error difference per sample; it is not directly a velocity-error gain.</text><text x="60" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#a5620a" font-weight="700" text-anchor="start">Current interface limitation</text><text x="60" y="769" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">The CAN velocity field has no control contribution because its separate velocity gain stays zero.</text></g></svg>