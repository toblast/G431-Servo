<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title description">
<title id="title">01 / One system, two controllers</title><desc id="description">ESP32 decides the requested motion. STM32 performs the local motor control.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="860" rx="18" fill="#ffffff"/>
<g><rect x="470" y="350" width="350" height="52" rx="12" fill="#edf3ff"/><rect x="40" y="775" width="1200" height="84" rx="12" fill="#f0f3f7"/></g><g><path d="M 340,235 L 450,235" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 450,365 L 340,365" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 840,275 L 950,275" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 645,510 L 645,425" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1085,325 L 1085,465" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#slate)"/><path d="M 1085,560 L 1085,660" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#slate)"/><path d="M 1085,390 L 875,390 L 875,570 L 790,570" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#slate)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">01 / One system, two controllers</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">ESP32 decides the requested motion. STM32 performs the local motor control.</text><rect x="40" y="155" width="300" height="270" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="60" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">HIGH-LEVEL / SEPARATE PROJECT</text><text x="60" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">ESP32-WROOM-32D</text><text x="60" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Speed, brake, clutch, ON/OFF</text><text x="60" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Cruise-control decisions</text><text x="60" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Desired throttle opening</text><text x="60" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Convert to motor coordinates</text><rect x="450" y="155" width="390" height="270" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="470" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">THIS FIRMWARE / B-G431B-ESC1</text><text x="470" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">STM32G431</text><text x="470" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Validate CAN and manage state</text><text x="470" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Read AS5600; run position PD</text><text x="470" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Regulate motor currents / FOC</text><text x="490" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">PWM → gate drivers → power stage</text><rect x="950" y="205" width="270" height="120" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="970" y="241" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">GB5215 motor</text><text x="970" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Motor-shaft rotation</text><rect x="950" y="465" width="270" height="95" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="970" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">External reduction</text><text x="970" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Ratio still provisional</text><rect x="950" y="660" width="270" height="95" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="970" y="696" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Throttle pulley</text><text x="970" y="727" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Mechanical load</text><rect x="500" y="510" width="290" height="120" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="520" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">AS5600 encoder</text><text x="520" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Measures the motor rotor</text><text x="520" y="603" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">I2C feedback to STM32</text><rect x="340.9" y="194" width="108.19999999999999" height="23" rx="5" fill="#ffffff"/><text x="395" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">CAN command</text><rect x="332.7" y="324" width="124.6" height="23" rx="5" fill="#ffffff"/><text x="395" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#087f73" font-weight="600" text-anchor="middle">Position / Iq</text><rect x="853.2" y="234" width="83.6" height="23" rx="5" fill="#ffffff"/><text x="895" y="251" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">3 phases</text><rect x="578.6" y="458" width="132.79999999999998" height="23" rx="5" fill="#ffffff"/><text x="645" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#087f73" font-weight="600" text-anchor="middle">Angle + status</text><rect x="1010.4" y="596" width="149.2" height="23" rx="5" fill="#ffffff"/><text x="1085" y="613" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle">Mechanical drive</text><rect x="812.7" y="444" width="124.6" height="23" rx="5" fill="#ffffff"/><text x="875" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle">Rotor sensing</text><text x="60" y="805" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b" font-weight="700" text-anchor="start">Read the arrows</text><text x="60" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">Blue: command / electrical actuation. Teal: feedback. Dashed grey: mechanical relationship.</text></g></svg>