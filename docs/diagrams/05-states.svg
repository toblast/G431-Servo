<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title description">
<title id="title">05 / Enabling motion is an explicit transition</title><desc id="description">A logical state view: implementation uses arming flags, fault bits and the FOC state.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="960" rx="18" fill="#ffffff"/>
<g><rect x="40" y="780" width="1200" height="84" rx="12" fill="#edf3ff"/><rect x="40" y="875" width="1200" height="84" rx="12" fill="#fff7e8"/></g><g><path d="M 200,215 L 200,300" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 360,335 L 480,335" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 480,395 L 430,395 L 430,480 L 200,480 L 200,425" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 800,360 L 920,360" fill="none" stroke="#bc3548" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><path d="M 1080,300 L 1080,250 L 200,250 L 200,300" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 300,425 L 300,650 L 480,650" fill="none" stroke="#a5620a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 640,600 L 640,540 L 120,540 L 120,425" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 800,650 L 865,650 L 865,395 L 920,395" fill="none" stroke="#bc3548" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><path d="M 1080,565 L 1080,600" fill="none" stroke="#bc3548" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">05 / Enabling motion is an explicit transition</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">A logical state view: implementation uses arming flags, fault bits and the FOC state.</text><rect x="40" y="145" width="320" height="70" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="60" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Power-up / MCU reset</text><rect x="40" y="300" width="320" height="125" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="60" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">DISARMED</text><text x="60" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">can_armed = false</text><text x="60" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">FOC IDLE / coast</text><rect x="480" y="300" width="320" height="125" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="500" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">ARMED SERVO</text><text x="500" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">can_armed = true</text><text x="500" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">FOC torque control on publish</text><rect x="920" y="300" width="320" height="125" rx="14" fill="#fff0f2" stroke="#bc3548" stroke-width="1.5"/><text x="940" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">FAULT INHIBITED</text><text x="940" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Fault flags block outputs</text><text x="940" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Foreground disarms</text><rect x="480" y="600" width="320" height="125" rx="14" fill="#fff7e8" stroke="#a5620a" stroke-width="1.5"/><text x="500" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">CALIBRATING</text><text x="500" y="667" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Manual alignment motion</text><text x="500" y="693" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">FOC flux control + idle</text><rect x="920" y="500" width="320" height="65" rx="14" fill="#fff0f2" stroke="#bc3548" stroke-width="1.5"/><text x="940" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">CPU / init failure</text><rect x="920" y="600" width="320" height="125" rx="14" fill="#fff0f2" stroke="#bc3548" stroke-width="1.5"/><text x="940" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">FATAL STOP</text><text x="940" y="667" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Clear MOE directly</text><text x="940" y="693" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Halt until MCU reset</text><rect x="374.1" y="292" width="91.8" height="23" rx="5" fill="#ffffff"/><text x="420" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle">Valid ARM</text><rect x="309.0" y="463" width="182.0" height="23" rx="5" fill="#ffffff"/><text x="400" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle">DISARM / CAN timeout</text><rect x="805.9" y="319" width="108.19999999999999" height="23" rx="5" fill="#ffffff"/><text x="860" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#bc3548" font-weight="600" text-anchor="middle">Local fault</text><rect x="466.0" y="233" width="427.99999999999994" height="23" rx="5" fill="#ffffff"/><text x="680" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle">Fault cleared or reset → DISARMED; ARM is separate</text><rect x="184.4" y="553" width="231.2" height="23" rx="5" fill="#ffffff"/><text x="300" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a5620a" font-weight="600" text-anchor="middle">New button press / healthy</text><rect x="546.7" y="523" width="206.6" height="23" rx="5" fill="#ffffff"/><text x="650" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle">Done / cancel / cleanup</text><rect x="835.5" y="493" width="59.0" height="23" rx="5" fill="#ffffff"/><text x="865" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#bc3548" font-weight="600" text-anchor="middle">Fault</text><text x="1080" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#bc3548" font-weight="400" text-anchor="middle">Can occur from any mode</text><text x="60" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">Actual FOC states</text><text x="60" y="839" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">FOC_STATE_IDLE = 0; FOC_STATE_TORQUE_CONTROL = 1; FOC_STATE_FLUX_CONTROL = 10.</text><text x="60" y="905" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#a5620a" font-weight="700" text-anchor="start">Calibration exception</text><text x="60" y="934" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">A new button press can deliberately move a disarmed motor. A button held at startup must first be released.</text></g></svg>