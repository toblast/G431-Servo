<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="title description">
<title id="title">07 / Start dependencies before accepting commands</title><desc id="description">The encoder and configuration exist before ADC callbacks can use them. Startup never enters the armed servo state.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="825" rx="18" fill="#ffffff"/>
<g><rect x="40" y="705" width="1200" height="84" rx="12" fill="#fff0f2"/></g><g><path d="M 600,202 L 680,202" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 960,265 L 960,335" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 680,397 L 600,397" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 320,460 L 320,530" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/><path d="M 600,592 L 680,592" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#slate)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">07 / Start dependencies before accepting commands</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">The encoder and configuration exist before ADC callbacks can use them. Startup never enters the armed servo state.</text><rect x="40" y="140" width="560" height="125" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="60" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">1. Configure the MCU and peripherals</text><text x="60" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">HAL / clocks / pins / DMA / timers / ADC / I2C / CAN</text><text x="60" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Peripheral configuration does not accept CAN commands yet.</text><rect x="680" y="140" width="560" height="125" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="700" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">2. Start timebase and load configuration</text><text x="700" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Start TIM6; initialize/load EEPROM; reset RAM registers.</text><text x="700" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Validate configuration and initialize the serial interface.</text><rect x="680" y="335" width="560" height="125" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="700" y="371" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">3. Initialize the AS5600</text><text x="700" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Configure sensor, check magnet and read initial angle.</text><text x="700" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">An initialization failure blocks arming.</text><rect x="40" y="335" width="560" height="125" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="60" y="371" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">4. Initialize FOC and start acquisition</text><text x="60" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Configure CORDIC before starting ADC DMA callbacks.</text><text x="60" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Keep TIM1 MOE clear; leave FOC disabled.</text><rect x="40" y="530" width="560" height="125" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="60" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">5. Service monitoring while disabled</text><text x="60" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Update voltage / temperature and keep outputs in coast.</text><text x="60" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Voltage faults can remain set while readings settle.</text><rect x="680" y="530" width="560" height="125" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="700" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">6. Start CAN reception last</text><text x="700" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">FDCAN_Config enables reception and notifications.</text><text x="700" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Only an explicit valid ARM can enable the servo path.</text><text x="60" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#bc3548" font-weight="700" text-anchor="start">Failure paths</text><text x="60" y="764" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">A peripheral start failure halts with outputs off. Sensor/configuration faults inhibit ARM; reset still begins disarmed.</text></g></svg>