<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="865" viewBox="0 0 1280 865" role="img" aria-labelledby="title description">
<title id="title">04 / Three execution contexts, one MCU</title><desc id="description">This is a bare-metal main loop with interrupt callbacks; it is not an RTOS task architecture.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc3548"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5620a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="865" rx="18" fill="#ffffff"/>
<g><rect x="40" y="125" width="1200" height="215" rx="12" fill="#edf3ff"/><rect x="40" y="375" width="1200" height="135" rx="12" fill="#eaf8f4"/><rect x="40" y="545" width="1200" height="205" rx="12" fill="#f0f3f7"/><rect x="40" y="775" width="1200" height="84" rx="12" fill="#f0f3f7"/></g><g><path d="M 270,245 L 325,245" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 545,245 L 600,245" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 885,245 L 940,245" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 630,458 L 695,458" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 930,458 L 995,458" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/></g><g><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#18324a" font-weight="700" text-anchor="start">04 / Three execution contexts, one MCU</text><text x="40" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#526274" font-weight="400" text-anchor="start">This is a bare-metal main loop with interrupt callbacks; it is not an RTOS task architecture.</text><text x="60" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">FAST CURRENT CONTROL  /  ADC + DMA interrupts  /  priority 0</text><rect x="60" y="185" width="210" height="120" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="80" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">TIM1 trigger</text><text x="80" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">40 kHz PWM</text><text x="80" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">25 µs period</text><rect x="325" y="185" width="220" height="120" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="345" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">ADC1 / ADC2</text><text x="345" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Phase-current samples</text><text x="345" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">DMA completion</text><rect x="600" y="185" width="285" height="120" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="620" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">foc.c callbacks</text><text x="620" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">API_FOC_It</text><text x="620" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Current protection → FOC</text><rect x="940" y="185" width="280" height="120" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="960" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">PI → PWM</text><text x="960" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Transform / regulate</text><text x="960" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Update timer duties</text><text x="60" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#087f73" font-weight="700" text-anchor="start">CAN RECEPTION  /  message-driven interrupt  /  priority 3</text><text x="60" y="447" font-family="Consolas, monospace" font-size="19" fill="#18324a" font-weight="700" text-anchor="start">main.c RX callback</text><text x="60" y="479" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">Can interrupt foreground work.</text><rect x="400" y="425" width="230" height="65" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="420" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Validate frame</text><rect x="695" y="425" width="235" height="65" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="715" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">State + goals</text><rect x="995" y="425" width="225" height="65" rx="14" fill="#eaf8f4" stroke="#087f73" stroke-width="1.5"/><text x="1015" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Queue reply</text><text x="60" y="579" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="700" text-anchor="start">FOREGROUND  /  main.c while (1)</text><rect x="60" y="605" width="340" height="115" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="80" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Every loop pass</text><text x="80" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Check fault flags</text><text x="80" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Check CAN / FOC watchdogs</text><rect x="450" y="605" width="360" height="115" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="470" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Every 250 µs, when due</text><text x="470" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">AS5600 → PD → publish Iq / Id</text><text x="470" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Update telemetry registers</text><rect x="860" y="605" width="360" height="115" rx="14" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/><text x="880" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#18324a" font-weight="700" text-anchor="start">Every 10 ms, when due</text><text x="880" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Voltage / temperature / config</text><text x="880" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#18324a" font-weight="400" text-anchor="start">Button + bounded serial work</text><text x="60" y="805" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b" font-weight="700" text-anchor="start">Timing interpretation</text><text x="60" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#18324a" font-weight="400" text-anchor="start">Priority 0 can preempt CAN and foreground. UART IRQ priority is 4. Periods are targets; worst-case timing needs measurement.</text></g></svg>